<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Animated 4 by 4 systolic array</title>
  <desc id="desc">Activations stream from left to right, weights stream from top to bottom, and processing elements pulse in diagonal wavefronts as they multiply and accumulate.</desc>

  <style>
    :root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #667382;
      --line: #aab5c2;
      --pe: #ffffff;
      --pe-stroke: #516170;
      --a: #1a73e8;
      --b: #12a05c;
      --mac: #f9ab00;
      --sum: #d93025;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --panel: #171c21;
        --ink: #edf2f7;
        --muted: #a8b3bf;
        --line: #54616d;
        --pe: #20272e;
        --pe-stroke: #82909d;
        --a: #6ea8ff;
        --b: #55d68b;
        --mac: #ffd166;
        --sum: #ff766e;
      }
    }

    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      fill: var(--ink);
    }

    .title { font-size: 22px; font-weight: 700; letter-spacing: 0; }
    .subtitle { font-size: 12px; fill: var(--muted); }
    .axis-label { font-size: 12px; font-weight: 700; }
    .token-label { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .pe-label { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .mac-label { font-size: 8px; fill: var(--muted); text-anchor: middle; }
    .legend { font-size: 11px; fill: var(--muted); }

    .lane {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      marker-end: url(#arrow);
    }

    .pe {
      fill: var(--pe);
      stroke: var(--pe-stroke);
      stroke-width: 1.5;
      rx: 8;
      transform-box: fill-box;
      transform-origin: center;
      animation: mac-pulse 5s ease-in-out infinite;
    }

    .d0 { animation-delay: 1.0s; }
    .d1 { animation-delay: 1.35s; }
    .d2 { animation-delay: 1.70s; }
    .d3 { animation-delay: 2.05s; }
    .d4 { animation-delay: 2.40s; }
    .d5 { animation-delay: 2.75s; }
    .d6 { animation-delay: 3.10s; }

    .sum-box {
      fill: var(--panel);
      stroke: var(--sum);
      stroke-width: 1.5;
      rx: 7;
      animation: sum-pulse 5s ease-in-out infinite;
    }

    .s0 { animation-delay: 3.05s; }
    .s1 { animation-delay: 3.40s; }
    .s2 { animation-delay: 3.75s; }
    .s3 { animation-delay: 4.10s; }

    @keyframes mac-pulse {
      0%, 8%, 28%, 100% {
        fill: var(--pe);
        stroke: var(--pe-stroke);
        transform: scale(1);
        filter: none;
      }
      14% {
        fill: var(--mac);
        stroke: var(--mac);
        transform: scale(1.10);
        filter: drop-shadow(0 0 6px var(--mac));
      }
    }

    @keyframes sum-pulse {
      0%, 8%, 30%, 100% {
        fill: var(--panel);
        transform: scale(1);
      }
      15% {
        fill: var(--sum);
        transform: scale(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pe, .sum-box { animation: none; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="468" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-opacity="0.45"/>
  <text x="34" y="42" class="title">SYSTOLIC ARRAY · MATRIX MULTIPLY</text>
  <text x="34" y="65" class="subtitle">conceptual 4×4 dataflow · one multiply-accumulate per active PE per cycle</text>

  <g filter="url(#soft-shadow)">
    <rect x="32" y="94" width="160" height="338" rx="10" fill="var(--panel)"/>
  </g>
  <text x="52" y="124" class="axis-label" fill="var(--a)">A · ACTIVATIONS</text>
  <text x="52" y="147" class="subtitle">flow left → right</text>

  <g>
    <rect x="60" y="176" width="42" height="24" rx="12" fill="var(--a)"/>
    <text x="81" y="192" class="token-label" text-anchor="middle">A0</text>
    <rect x="60" y="242" width="42" height="24" rx="12" fill="var(--a)"/>
    <text x="81" y="258" class="token-label" text-anchor="middle">A1</text>
    <rect x="60" y="308" width="42" height="24" rx="12" fill="var(--a)"/>
    <text x="81" y="324" class="token-label" text-anchor="middle">A2</text>
    <rect x="60" y="374" width="42" height="24" rx="12" fill="var(--a)"/>
    <text x="81" y="390" class="token-label" text-anchor="middle">A3</text>
  </g>

  <text x="300" y="102" class="axis-label" fill="var(--b)">B · WEIGHTS</text>
  <text x="300" y="120" class="subtitle">flow top → bottom</text>

  <g opacity="0.9">
    <path class="lane" d="M112 188 H650"/>
    <path class="lane" d="M112 254 H650"/>
    <path class="lane" d="M112 320 H650"/>
    <path class="lane" d="M112 386 H650"/>

    <path class="lane" d="M326 112 V430"/>
    <path class="lane" d="M406 112 V430"/>
    <path class="lane" d="M486 112 V430"/>
    <path class="lane" d="M566 112 V430"/>
  </g>

  <g>
    <circle r="9" fill="var(--a)">
      <animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M112 188 H650"/>
    </circle>
    <circle r="9" fill="var(--a)">
      <animateMotion dur="5s" begin="0.35s" repeatCount="indefinite" path="M112 254 H650"/>
    </circle>
    <circle r="9" fill="var(--a)">
      <animateMotion dur="5s" begin="0.70s" repeatCount="indefinite" path="M112 320 H650"/>
    </circle>
    <circle r="9" fill="var(--a)">
      <animateMotion dur="5s" begin="1.05s" repeatCount="indefinite" path="M112 386 H650"/>
    </circle>

    <circle r="9" fill="var(--b)">
      <animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M326 112 V430"/>
    </circle>
    <circle r="9" fill="var(--b)">
      <animateMotion dur="5s" begin="0.35s" repeatCount="indefinite" path="M406 112 V430"/>
    </circle>
    <circle r="9" fill="var(--b)">
      <animateMotion dur="5s" begin="0.70s" repeatCount="indefinite" path="M486 112 V430"/>
    </circle>
    <circle r="9" fill="var(--b)">
      <animateMotion dur="5s" begin="1.05s" repeatCount="indefinite" path="M566 112 V430"/>
    </circle>
  </g>

  <g>
    <g transform="translate(300 162)"><rect width="52" height="52" class="pe d0"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(380 162)"><rect width="52" height="52" class="pe d1"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(460 162)"><rect width="52" height="52" class="pe d2"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(540 162)"><rect width="52" height="52" class="pe d3"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>

    <g transform="translate(300 228)"><rect width="52" height="52" class="pe d1"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(380 228)"><rect width="52" height="52" class="pe d2"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(460 228)"><rect width="52" height="52" class="pe d3"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(540 228)"><rect width="52" height="52" class="pe d4"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>

    <g transform="translate(300 294)"><rect width="52" height="52" class="pe d2"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(380 294)"><rect width="52" height="52" class="pe d3"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(460 294)"><rect width="52" height="52" class="pe d4"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(540 294)"><rect width="52" height="52" class="pe d5"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>

    <g transform="translate(300 360)"><rect width="52" height="52" class="pe d3"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(380 360)"><rect width="52" height="52" class="pe d4"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(460 360)"><rect width="52" height="52" class="pe d5"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
    <g transform="translate(540 360)"><rect width="52" height="52" class="pe d6"/><text x="26" y="24" class="pe-label">PE</text><text x="26" y="39" class="mac-label">MAC</text></g>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="684" y="94" width="244" height="338" rx="10" fill="var(--panel)"/>
  </g>
  <text x="708" y="124" class="axis-label" fill="var(--sum)">C · PARTIAL SUMS</text>
  <text x="708" y="147" class="subtitle">accumulate inside each PE</text>

  <g>
    <rect x="716" y="178" width="80" height="28" class="sum-box s0"/>
    <text x="756" y="197" class="pe-label">C[0,*]</text>
    <rect x="716" y="244" width="80" height="28" class="sum-box s1"/>
    <text x="756" y="263" class="pe-label">C[1,*]</text>
    <rect x="716" y="310" width="80" height="28" class="sum-box s2"/>
    <text x="756" y="329" class="pe-label">C[2,*]</text>
    <rect x="716" y="376" width="80" height="28" class="sum-box s3"/>
    <text x="756" y="395" class="pe-label">C[3,*]</text>
  </g>

  <g transform="translate(824 181)">
    <circle cx="7" cy="7" r="7" fill="var(--a)"/>
    <text x="22" y="11" class="legend">activation</text>
    <circle cx="7" cy="36" r="7" fill="var(--b)"/>
    <text x="22" y="40" class="legend">weight</text>
    <circle cx="7" cy="65" r="7" fill="var(--mac)"/>
    <text x="22" y="69" class="legend">MAC pulse</text>
  </g>

  <text x="824" y="286" class="subtitle">wavefront:</text>
  <text x="824" y="306" class="legend">each diagonal</text>
  <text x="824" y="324" class="legend">activates one</text>
  <text x="824" y="342" class="legend">cycle later</text>
</svg>
