<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Animated four by four systolic array</title>
  <desc id="desc">Skewed activations move from left to right and skewed weights move from top to bottom. Each processing element pulses exactly when its activation and weight meet, indicating a multiply-accumulate into its local output value.</desc>

  <style>
    :root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #667382;
      --line: #aab5c2;
      --pe: #ffffff;
      --pe-stroke: #516170;
      --a: #1a73e8;
      --b: #12a05c;
      --mac: #f9ab00;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --panel: #171c21;
        --ink: #edf2f7;
        --muted: #a8b3bf;
        --line: #54616d;
        --pe: #20272e;
        --pe-stroke: #82909d;
        --a: #6ea8ff;
        --b: #55d68b;
        --mac: #ffd166;
      }
    }

    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      fill: var(--ink);
    }

    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: var(--muted); }
    .section-label { font-size: 12px; font-weight: 700; }
    .lane-label { font-size: 10px; font-weight: 700; }
    .token-label { font-size: 9px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .pe-label { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .op-label { font-size: 8px; fill: var(--muted); text-anchor: middle; }
    .note { font-size: 11px; fill: var(--muted); }
    .formula { font-size: 12px; font-weight: 700; }

    .lane {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      marker-end: url(#arrow);
    }

    .pe {
      fill: var(--pe);
      stroke: var(--pe-stroke);
      stroke-width: 1.5;
    }

    .wave {
      fill: var(--mac);
      opacity: 0;
      animation: wave-pulse 6.4s linear infinite;
    }

    .w1 { animation-delay: 0.8s; }
    .w2 { animation-delay: 1.6s; }
    .w3 { animation-delay: 2.4s; }
    .w4 { animation-delay: 3.2s; }
    .w5 { animation-delay: 4.0s; }
    .w6 { animation-delay: 4.8s; }
    .w7 { animation-delay: 5.6s; }

    @keyframes wave-pulse {
      0% { opacity: 0.95; }
      2% { opacity: 1; }
      8% { opacity: 0; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave { animation: none; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="518" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-opacity="0.45"/>
  <text x="34" y="42" class="title">SYSTOLIC ARRAY · ONE k-SLICE</text>
  <text x="34" y="65" class="subtitle">skewed inputs meet on diagonal wavefronts · one grid step = one cycle</text>

  <circle cx="618" cy="39" r="6" fill="var(--a)"/>
  <text x="631" y="43" class="subtitle">A activation</text>
  <circle cx="733" cy="39" r="6" fill="var(--b)"/>
  <text x="746" y="43" class="subtitle">B weight</text>
  <circle cx="831" cy="39" r="6" fill="var(--mac)"/>
  <text x="844" y="43" class="subtitle">MAC event</text>

  <text x="194" y="111" class="section-label" fill="var(--a)">A[i,k]</text>
  <text x="194" y="128" class="subtitle">left → right</text>
  <text x="377" y="91" class="section-label" fill="var(--b)">B[k,j] · top → bottom</text>

  <g opacity="0.9">
    <path class="lane" d="M310 190 H710"/>
    <path class="lane" d="M310 270 H710"/>
    <path class="lane" d="M310 350 H710"/>
    <path class="lane" d="M310 430 H710"/>

    <path class="lane" d="M390 110 V510"/>
    <path class="lane" d="M470 110 V510"/>
    <path class="lane" d="M550 110 V510"/>
    <path class="lane" d="M630 110 V510"/>
  </g>

  <g class="lane-label">
    <text x="278" y="194" fill="var(--a)">i=0</text>
    <text x="278" y="274" fill="var(--a)">i=1</text>
    <text x="278" y="354" fill="var(--a)">i=2</text>
    <text x="278" y="434" fill="var(--a)">i=3</text>

    <text x="382" y="104" fill="var(--b)">j=0</text>
    <text x="462" y="104" fill="var(--b)">j=1</text>
    <text x="542" y="104" fill="var(--b)">j=2</text>
    <text x="622" y="104" fill="var(--b)">j=3</text>
  </g>

  <g>
    <g opacity="0">
      <circle r="12" fill="var(--a)"/>
      <text y="3" class="token-label">A0k</text>
      <animateMotion dur="6.4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M310 190 H710"/>
      <animate attributeName="opacity" dur="6.4s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
    <g opacity="0">
      <circle r="12" fill="var(--a)"/>
      <text y="3" class="token-label">A1k</text>
      <animateMotion dur="6.4s" begin="0.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M310 270 H710"/>
      <animate attributeName="opacity" dur="6.4s" begin="0.8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
    <g opacity="0">
      <circle r="12" fill="var(--a)"/>
      <text y="3" class="token-label">A2k</text>
      <animateMotion dur="6.4s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M310 350 H710"/>
      <animate attributeName="opacity" dur="6.4s" begin="1.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
    <g opacity="0">
      <circle r="12" fill="var(--a)"/>
      <text y="3" class="token-label">A3k</text>
      <animateMotion dur="6.4s" begin="2.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M310 430 H710"/>
      <animate attributeName="opacity" dur="6.4s" begin="2.4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>

    <g opacity="0">
      <circle r="12" fill="var(--b)"/>
      <text y="3" class="token-label">Bk0</text>
      <animateMotion dur="6.4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M390 110 V510"/>
      <animate attributeName="opacity" dur="6.4s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
    <g opacity="0">
      <circle r="12" fill="var(--b)"/>
      <text y="3" class="token-label">Bk1</text>
      <animateMotion dur="6.4s" begin="0.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M470 110 V510"/>
      <animate attributeName="opacity" dur="6.4s" begin="0.8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
    <g opacity="0">
      <circle r="12" fill="var(--b)"/>
      <text y="3" class="token-label">Bk2</text>
      <animateMotion dur="6.4s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M550 110 V510"/>
      <animate attributeName="opacity" dur="6.4s" begin="1.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
    <g opacity="0">
      <circle r="12" fill="var(--b)"/>
      <text y="3" class="token-label">Bk3</text>
      <animateMotion dur="6.4s" begin="2.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.625;1" path="M630 110 V510"/>
      <animate attributeName="opacity" dur="6.4s" begin="2.4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.61;0.625;1"/>
    </g>
  </g>

  <g filter="url(#soft-shadow)">
    <g transform="translate(362 164)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w1"/><text x="28" y="23" class="pe-label">PE00</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(442 164)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w2"/><text x="28" y="23" class="pe-label">PE01</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(522 164)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w3"/><text x="28" y="23" class="pe-label">PE02</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(602 164)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w4"/><text x="28" y="23" class="pe-label">PE03</text><text x="28" y="39" class="op-label">C += A×B</text></g>

    <g transform="translate(362 244)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w2"/><text x="28" y="23" class="pe-label">PE10</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(442 244)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w3"/><text x="28" y="23" class="pe-label">PE11</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(522 244)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w4"/><text x="28" y="23" class="pe-label">PE12</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(602 244)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w5"/><text x="28" y="23" class="pe-label">PE13</text><text x="28" y="39" class="op-label">C += A×B</text></g>

    <g transform="translate(362 324)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w3"/><text x="28" y="23" class="pe-label">PE20</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(442 324)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w4"/><text x="28" y="23" class="pe-label">PE21</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(522 324)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w5"/><text x="28" y="23" class="pe-label">PE22</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(602 324)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w6"/><text x="28" y="23" class="pe-label">PE23</text><text x="28" y="39" class="op-label">C += A×B</text></g>

    <g transform="translate(362 404)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w4"/><text x="28" y="23" class="pe-label">PE30</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(442 404)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w5"/><text x="28" y="23" class="pe-label">PE31</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(522 404)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w6"/><text x="28" y="23" class="pe-label">PE32</text><text x="28" y="39" class="op-label">C += A×B</text></g>
    <g transform="translate(602 404)"><rect width="56" height="52" rx="7" class="pe"/><rect width="56" height="52" rx="7" class="wave w7"/><text x="28" y="23" class="pe-label">PE33</text><text x="28" y="39" class="op-label">C += A×B</text></g>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="738" y="132" width="190" height="324" rx="10" fill="var(--panel)"/>
  </g>
  <text x="760" y="164" class="section-label">INSIDE EACH PE</text>
  <text x="760" y="198" class="note">when A[i,k] and</text>
  <text x="760" y="216" class="note">B[k,j] arrive together:</text>

  <text x="760" y="258" class="formula">product =</text>
  <text x="760" y="280" class="formula" fill="var(--mac)">A[i,k] × B[k,j]</text>
  <text x="760" y="320" class="formula">C[i,j] += product</text>

  <line x1="760" y1="344" x2="906" y2="344" stroke="var(--line)"/>
  <text x="760" y="375" class="note">one gold pulse</text>
  <text x="760" y="393" class="note">= one MAC event</text>
  <text x="760" y="425" class="note">C stays local while</text>
  <text x="760" y="443" class="note">k continues streaming.</text>
</svg>
