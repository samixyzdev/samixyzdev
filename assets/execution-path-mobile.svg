<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
  <title id="title">Mobile database execution research loop</title>
  <desc id="desc">A vertical systems cross-section connects a relational operator to an accelerator-native execution plan, memory movement and an accelerator substrate, and system measurements that feed back into layout and kernel decisions.</desc>
  <style>
    :root { --bg:#f7f9fc; --panel:#fff; --ink:#152335; --muted:#5d6b7d; --line:#b9c5d2; --blue:#2563eb; --yellow:#d89a00; --teal:#0f8f86; --teal-soft:#e3f6f3; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --panel:#111c2b; --ink:#edf4ff; --muted:#a8b6c8; --line:#3d5068; --blue:#69a5ff; --yellow:#f4c84a; --teal:#47d7c8; --teal-soft:#123a39; } }
    text { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; fill:var(--ink); }
    .eyebrow { font-size:15px; font-weight:700; }
    .label { font-size:22px; font-weight:700; }
    .detail { font-size:16px; fill:var(--muted); }
    .layer { fill:var(--panel); stroke:var(--line); stroke-width:2; }
    .measure { fill:var(--teal-soft); stroke:var(--teal); stroke-width:2; }
    .flow { fill:none; stroke:var(--blue); stroke-width:4; }
    .feedback { fill:none; stroke:var(--yellow); stroke-width:4; stroke-dasharray:10 8; }
  </style>
  <defs>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--blue)"/></marker>
    <marker id="yellow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--yellow)"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="698" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-opacity="0.55"/>
  <text x="28" y="38" class="eyebrow" fill="var(--blue)">SYSTEM CROSS-SECTION</text>
  <text x="28" y="64" class="detail">Measure, then revise the plan.</text>
  <g transform="translate(28 92)"><rect width="544" height="92" rx="8" class="layer"/><rect width="9" height="92" rx="4" fill="var(--blue)"/><text x="30" y="38" class="label">Query / relational operator</text><text x="30" y="68" class="detail">filter · join · aggregation</text></g>
  <path d="M300 184 V215" class="flow" marker-end="url(#blue-arrow)"/><text x="322" y="204" class="detail">lower · tile · layout</text>
  <g transform="translate(28 224)"><rect width="544" height="92" rx="8" class="layer"/><rect width="9" height="92" rx="4" fill="var(--yellow)"/><text x="30" y="38" class="label">Accelerator-native plan</text><text x="30" y="68" class="detail">operator semantics → kernels</text></g>
  <path d="M300 316 V347" class="flow" marker-end="url(#blue-arrow)"/>
  <g transform="translate(28 356)"><rect width="544" height="92" rx="8" class="layer"/><rect width="9" height="92" rx="4" fill="var(--teal)"/><text x="30" y="38" class="label">Movement / accelerator</text><text x="30" y="68" class="detail">current platform: accelerator</text></g>
  <path d="M300 448 V479" class="flow" marker-end="url(#blue-arrow)"/>
  <g transform="translate(28 488)"><rect width="544" height="104" rx="8" class="measure"/><text x="30" y="34" class="eyebrow" fill="var(--teal)">MEASURE</text><text x="30" y="72" class="label">Correctness · latency · bandwidth</text></g>
  <path d="M84 604 V646 H518 V602" class="feedback" marker-end="url(#yellow-arrow)"/>
  <text x="300" y="674" class="detail" text-anchor="middle" fill="var(--yellow)">revise layout / kernel</text>
</svg>
