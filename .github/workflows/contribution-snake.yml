name: Generate contribution snake

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563eb&color_dots=#edf2f7,#bfdbfe,#60a5fa,#2563eb,#facc15
            dist/github-contribution-grid-snake-dark.svg?color_snake=#facc15&color_dots=#10213a,#164e63,#0e7490,#22d3ee,#e0f2fe

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
